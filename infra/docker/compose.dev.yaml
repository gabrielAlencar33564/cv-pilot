# Desenvolvimento: só a infraestrutura roda no Docker.
# web, api e workers rodam no host com `pnpm dev` (hot reload, sem rebuild de imagem).
# Portas no host deslocadas (5433/6380) para não colidir com Postgres/Redis já instalados.
name: cv-pilot-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cvpilot
      POSTGRES_PASSWORD: cvpilot
      POSTGRES_DB: cvpilot
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvpilot -d cvpilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Storage S3 compatível (currículos)
  s3:
    image: chrislusf/seaweedfs:3.97
    environment:
      S3_ACCESS_KEY: cvpilot
      S3_SECRET_KEY: cvpilot-secret
    entrypoint: ["/bin/sh", "/s3-entrypoint.sh"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - ./seaweedfs/s3-entrypoint.sh:/s3-entrypoint.sh:ro
      - s3data:/data

volumes:
  pgdata:
  s3data:
