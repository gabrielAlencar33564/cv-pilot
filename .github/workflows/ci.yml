# Roda o `pnpm check` (Prisma generate, typecheck, lint, knip e testes) em push e PR para a main.
# O check não precisa de banco: ele só gera o Prisma Client.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sem `version`: usa o `packageManager` do package.json. `cache` guarda o store do pnpm.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
