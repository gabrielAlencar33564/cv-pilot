# Em push e PR para a main: `pnpm check` (generate, typecheck, lint, knip e testes de unidade)
# e, num job à parte com Postgres, `pnpm test:integration`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sem `version`: usa o `packageManager` do package.json. `cache` guarda o store do pnpm.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # Testes com Postgres de verdade (*.int.test.ts). O banco de teste é criado e migrado pelo setup.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cvpilot
          POSTGRES_PASSWORD: cvpilot
          POSTGRES_DB: cvpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cvpilot -d cvpilot"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cvpilot:cvpilot@localhost:5432/cvpilot?schema=public
      TEST_DATABASE_URL: postgresql://cvpilot:cvpilot@localhost:5432/cvpilot_test?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration
